syntax = "proto3";

package ledger.v1;

option go_package = "github.com/andreis3/isura-ledger-ms/internal/transport/grpc/pb/ledger/v1;pb";

// ─── CreateAccount ───────────────────────────────────────────

// Moedas suportadas pelo motor
enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_BRL = 1;
  CURRENCY_USD = 2;
  CURRENCY_EUR = 3;
}

message CreateAccountRequest {
  string account_external_id = 1;
  string account_number = 2;      // Número interno ou agência/conta
  string tax_id = 3;
  Currency currency = 4;          // Enum forte
}

message CreateAccountResponse {
  string account_id = 1;
}

// ─── GetBalance ───────────────────────────────────────────

message GetBalanceRequest {
  string external_account_id = 1;
}

message GetBalanceResponse {
  int64 balance = 1;
  string currency = 2;
}