syntax = "proto3";

package ledger.v1;

option go_package = "github.com/andreis3/isura-ledger-ms/internal/transport/grpc/pb/ledger/v1;pb";

// ─── CreateAccount ───────────────────────────────────────────

// Tipos contábeis do motor double-entry
enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_ASSET = 1;       // Ativo (Reservas/Empréstimos)
  ACCOUNT_TYPE_LIABILITY = 2;   // Passivo (Contas de clientes)
  ACCOUNT_TYPE_REVENUE = 3;     // Receita de Tarifas
  ACCOUNT_TYPE_EXPENSE = 4;     // Despesas operacionais
}

// Moedas suportadas pelo motor
enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_BRL = 1;
  CURRENCY_USD = 2;
  CURRENCY_EUR = 3;
}

message CreateAccountRequest {
  string owner_id = 1;         // Ex: ID do usuário/cliente no customers-ms
  string account_external_id = 2;
  string account_number = 3;      // Número interno ou agência/conta
  string tax_id = 4;
  AccountType account_type = 5; // Enum forte
  Currency currency = 6;          // Enum forte
}

message CreateAccountResponse {
  string account_id = 1;
}

// ─── GetBalance ───────────────────────────────────────────

message GetBalanceRequest {
  string external_account_id = 1;
}

message GetBalanceResponse {
  int64 balance = 1;
  string currency = 2;
}